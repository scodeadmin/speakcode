name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: |
          Thanks for opening your first issue here. I read all of them, and it is one person doing this, so give it a few days. If a week goes by with nothing, comment again and it will surface.
        pr-message: |
          Thanks for your first pull request to SpeakCode.

          A few things while you wait: name your PR after your technical role if this is a learning path submission, and check that nothing personal made it into the file. Everything here is public.

          I edit lightly. Typos and formatting, yes. Your voice stays as you wrote it.
